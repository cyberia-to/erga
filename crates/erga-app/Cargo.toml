[package]
name = "erga-app"
version = "0.5.0"
edition = "2021"
description = "One-button ERGO miner for Apple Silicon"

[[bin]]
name = "erga"
path = "src/main.rs"

[dependencies]
erga-miner   = { path = "../erga-miner" }
erga-wallet  = { path = "../erga-wallet" }
eframe       = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
egui         = "0.28"
ureq         = { version = "2", features = ["json"] }
serde_json   = "1"
sysinfo      = "0.39"
