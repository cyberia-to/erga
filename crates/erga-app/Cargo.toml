[package]
name = "erga-app"
version = "0.1.0"
edition = "2021"
description = "One-button ERGO miner for Apple Silicon"

[[bin]]
name = "erga"
path = "src/main.rs"

[dependencies]
mine-bench   = { path = "../mine-bench" }
rtable-bench = { path = "../rtable-bench" }
aruminium    = { path = "../../../honeycrisp/aruminium" }
eframe       = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
egui         = "0.28"
ureq         = { version = "2", features = ["json"] }
serde_json   = "1"
