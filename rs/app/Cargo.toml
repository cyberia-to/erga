[package]
name = "erga-app"
version = "0.28.0"
edition = "2021"
description = "One-button ERGO miner for Apple Silicon"

[dependencies]
erga-miner   = { path = "../miner" }
erga-wallet  = { path = "../wallet" }
eframe       = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
egui         = "0.28"
ureq         = { version = "2", features = ["json"] }
serde_json   = "1"
sysinfo      = "0.39"
tray-icon = "0.24.2"
